name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# One in-flight run per branch; a new push cancels the previous one.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: GHC ${{ matrix.ghc }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Both sides of the MIN_VERSION_base(4,20,0) CPP shim in
        # Fitness/Population/Evolution: 9.6 needs the explicit foldl'
        # import, 9.10 gets it from the Prelude and rejects the import as
        # redundant under -Werror. Only one branch can be exercised on any
        # single compiler, so testing one version would leave the other
        # permanently unverified.
        ghc: ['9.6', '9.10']

    steps:
      - uses: actions/checkout@v4

      - uses: haskell-actions/setup@v2
        id: setup
        with:
          ghc-version: ${{ matrix.ghc }}
          cabal-version: 'latest'

      - name: Configure
        run: cabal configure --enable-tests --enable-benchmarks

      - name: Freeze
        run: cabal freeze

      - uses: actions/cache@v4
        with:
          path: ${{ steps.setup.outputs.cabal-store }}
          key: ${{ runner.os }}-ghc-${{ matrix.ghc }}-${{ hashFiles('cabal.project.freeze') }}
          restore-keys: ${{ runner.os }}-ghc-${{ matrix.ghc }}-

      - name: Build
        run: cabal build all --enable-tests

      - name: Test
        run: cabal test all --test-show-details=direct
