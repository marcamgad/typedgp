name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: GHC ${{ matrix.ghc }}
    runs-on: ubuntu-latest

    # The official Haskell images ship GHC and cabal already installed and
    # on PATH, so there is no toolchain-provisioning stage to go wrong.
    #
    # Chosen over haskell-actions/setup@v2 for that simplicity, __not__
    # because the action was at fault. It failed three times here with an
    # opaque "cabal failed with exit code 1", and the real cause was a
    # UTF-8 BOM accidentally prepended to typedgp.cabal — cabal cannot
    # parse a .cabal file that starts with one, so every stage that touched
    # the package manifest died the same way. Two attempts to fix this by
    # tuning the action's GHC and cabal versions were treating a symptom.
    #
    # What the container actually bought was a __readable error message__:
    # the same failure, surfaced as a cabal parse error naming the file,
    # line and byte-order mark instead of a bare exit code.
    container: haskell:${{ matrix.ghc }}

    strategy:
      fail-fast: false
      matrix:
        # Exercises both sides of the MIN_VERSION_base(4,20,0) CPP shim in
        # Fitness, Population and Evolution: 9.6.7 ships base 4.18 and needs
        # the explicit foldl' import, 9.10.1 ships base 4.20 and rejects
        # that import as redundant under -Werror. Only one branch can
        # compile on any single compiler, so a single-version matrix would
        # leave the other permanently unverified.
        ghc: ['9.6.7', '9.10.1']

    steps:
      - uses: actions/checkout@v4

      - name: Versions
        run: |
          ghc --version
          cabal --version

      - name: Update package index
        run: cabal update

      # No dependency cache and no freeze file, deliberately: this package
      # depends on `base` alone, so there is nothing to resolve, download or
      # cache. Both existed in the first version of this workflow and were
      # pure ceremony.
      - name: Build
        run: cabal build all --enable-tests

      - name: Test
        run: cabal test all --test-show-details=direct
