name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# One in-flight run per branch; a new push cancels the previous one.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: GHC ${{ matrix.ghc }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Two-component versions, which the setup action resolves itself —
        # observed resolving to 9.6.7 and 9.10.3. The 9.10 line is the
        # compiler this was developed on.
        #
        # The pair exercises both sides of the MIN_VERSION_base(4,20,0) CPP
        # shim in Fitness, Population and Evolution: the 9.6 line ships
        # base 4.18 and needs the explicit foldl' import, the 9.10 line
        # ships base 4.20 and rejects that import as redundant under
        # -Werror. Only one branch can compile on any single compiler, so
        # testing one version would leave the other unverified.
        ghc: ['9.6', '9.10']

    steps:
      - uses: actions/checkout@v4

      - uses: haskell-actions/setup@v2
        with:
          ghc-version: ${{ matrix.ghc }}
          # Pinned, not 'latest'. 'latest' resolved to cabal 3.16.1.0,
          # whose "Setting up cabal" step failed on both compilers before
          # a single line was compiled. A moving version is also the wrong
          # default for a project whose central claim is reproducibility:
          # 'latest' means the build can break without anything in the
          # repository changing.
          cabal-version: '3.12.1.0'

      - name: Update package index
        run: cabal update

      # No dependency cache, and no freeze file, on purpose: this package
      # depends on `base` alone, so there is nothing to resolve, download or
      # cache. Both steps existed in the first version of this workflow and
      # were pure ceremony — added failure surface buying nothing.
      - name: Build
        run: cabal build all --enable-tests

      - name: Test
        run: cabal test all --test-show-details=direct
