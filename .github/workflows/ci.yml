name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: GHC ${{ matrix.ghc }}
    runs-on: ubuntu-latest

    # The official Haskell images ship GHC and cabal already installed and
    # on PATH, which removes the entire toolchain-provisioning stage from
    # the failure surface.
    #
    # This replaces haskell-actions/setup@v2, which failed here on every
    # attempt — with cabal 'latest' (3.16.1.0) and again with cabal pinned
    # to 3.12.1.0, both times at its internal "Setting up cabal" stage,
    # before a single line of this package was compiled. Two guesses at its
    # inputs fixed nothing, so the action is gone rather than tuned.
    container: haskell:${{ matrix.ghc }}

    strategy:
      fail-fast: false
      matrix:
        # Exercises both sides of the MIN_VERSION_base(4,20,0) CPP shim in
        # Fitness, Population and Evolution: 9.6.7 ships base 4.18 and needs
        # the explicit foldl' import, 9.10.1 ships base 4.20 and rejects
        # that import as redundant under -Werror. Only one branch can
        # compile on any single compiler, so a single-version matrix would
        # leave the other permanently unverified.
        ghc: ['9.6.7', '9.10.1']

    steps:
      - uses: actions/checkout@v4

      - name: Versions
        run: |
          ghc --version
          cabal --version

      - name: Update package index
        run: cabal update

      # No dependency cache and no freeze file, deliberately: this package
      # depends on `base` alone, so there is nothing to resolve, download or
      # cache. Both existed in the first version of this workflow and were
      # pure ceremony.
      - name: Build
        run: cabal build all --enable-tests

      - name: Test
        run: cabal test all --test-show-details=direct
